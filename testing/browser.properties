# Browser settings for the standalone (non-testrunner) WebdriverIO mode.
#
# Read by testing/pageobjects/WebDriverHelper.js through `properties-reader`. Keeping them in a
# .properties file rather than in JavaScript is the convention in Java/Selenium teams, and it
# means the same suite can be pointed at a different browser or grid without touching code.
#
# Every value can be overridden by an environment variable, which is what CI uses.

browser.name=chrome
# Blank means "whatever is installed". Set e.g. 141 to pin a version on a grid.
browser.version=153.0.8010.37
browser.headless=false
browser.width=1280
browser.height=900

base.url=http://127.0.0.1:4800

# Where the WebDriver endpoint lives. Leave hostname blank to let WebdriverIO start and manage
# a local driver itself; set it to reach a Selenium Grid, a container, or an already-running
# chromedriver.
driver.hostname=
driver.port=4444
driver.path=/

timeout.implicit=0
timeout.waitfor=10000
